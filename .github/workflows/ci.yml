name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The pinned Chromium that renders exports; its version is fixed by playwright-core.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ided/browsers
          key: ided-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: node dist/cli.js browser install
      - if: runner.os == 'Linux'
        run: node node_modules/playwright-core/cli.js install-deps chromium-headless-shell
      - run: npm test

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      - name: Extension and CLI versions agree
        run: test "$(node -p 'require("./vscode/package.json").version')" = "$(node -p 'require("./package.json").version')"
      - run: npm ci && npm run build
      - working-directory: vscode
        run: npm ci && npm run typecheck && npm run package
      # A downloaded VS Code with its own profile runs the extension against a fresh workspace.
      - working-directory: vscode
        run: xvfb-run -a npm test
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode/ide-design.vsix

  package:
    name: global install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npm pack
      - run: npm install -g ./ide-design-*.tgz
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ided/browsers
          key: ided-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: node node_modules/playwright-core/cli.js install-deps chromium-headless-shell
      - name: Fresh workspace
        run: |
          mkdir -p "$RUNNER_TEMP/ws" && cd "$RUNNER_TEMP/ws"
          ided init --here --name "Smoke Test"
          ided check
          ided export intro -f pdf
          ided export brand --zip
          ls -R out | head -40
      - name: Example workspace
        working-directory: examples/acme
        run: |
          ided check
          ided export intro -f png --frames 01-statement,03-the-check
          ided export brand --out out
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-exports
          path: |
            ${{ runner.temp }}/ws/out
            examples/acme/out
