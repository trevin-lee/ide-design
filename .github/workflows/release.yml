# Push a tag that matches package.json (git tag -a v0.1.0 -m "0.1.0" && git push --follow-tags).
# Tests, attaches the package and the VS Code extension to a GitHub release, publishes to npm when an
# NPM_TOKEN secret exists, then installs the rendered formula with real Homebrew
# and pushes it to <owner>/homebrew-tap only if that install and `brew test` pass.
#
# Run it by hand (workflow_dispatch) to rehearse: everything except the GitHub
# release, npm and the tap push.
#
# Secrets: TAP_DEPLOY_KEY (private half of a deploy key with write access to the
# tap repository) and, optionally, NPM_TOKEN and OVSX_TOKEN. The VS Code Marketplace needs no
# secret: publish-extension.yml signs in with the AZURE_* repository variables (see there).

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Version, tag and changelog agree
        id: meta
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$PUBLISH" = "true" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          grep -q "^## $version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          extension=$(node -p 'require("./vscode/package.json").version')
          [ "$extension" = "$version" ] || { echo "::error::vscode/package.json is $extension, package.json is $version"; exit 1; }
          if [ "$PUBLISH" = "true" ] && grep -q "^## $version.*unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still marks $version as unreleased; give it a date"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ided/browsers
          key: ided-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: node dist/cli.js browser install
      - run: node node_modules/playwright-core/cli.js install-deps chromium-headless-shell
      - run: npm test

      - name: Pack
        id: pack
        run: |
          tarball=$(npm pack --silent)
          versioned="ide-design-${{ steps.meta.outputs.version }}.tgz"
          [ "$tarball" = "$versioned" ] || mv "$tarball" "$versioned"
          cp "$versioned" ide-design.tgz
          # Workflows generated by ided 0.1 and 0.2 download releases/latest/download/ided.tgz.
          cp "$versioned" ided.tgz
          echo "sha256=$(sha256sum ide-design.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: VS Code extension
        working-directory: vscode
        run: |
          npm ci
          npm run typecheck
          npm run package
          cp ide-design.vsix "../ide-design-${{ steps.meta.outputs.version }}.vsix"
          cp ide-design.vsix ../ide-design.vsix
          xvfb-run -a npm test

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            ide-design-${{ steps.meta.outputs.version }}.tgz
            ide-design-${{ steps.meta.outputs.version }}.vsix

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.meta.outputs.version }}" '
            index($0, "## " v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ide-design-${{ steps.meta.outputs.version }}.tgz" ide-design.tgz ided.tgz \
            "ide-design-${{ steps.meta.outputs.version }}.vsix" ide-design.vsix \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

      - name: Publish to npm
        if: env.PUBLISH == 'true' && env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish "ide-design-${{ steps.meta.outputs.version }}.tgz" --provenance --access public
          rm ~/.npmrc

  extension:
    needs: release
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-extension.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  homebrew:
    needs: release
    runs-on: macos-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
      VERSION: ${{ needs.release.outputs.version }}
      SHA256: ${{ needs.release.outputs.sha256 }}
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: package

      - name: Install and test the formula with real Homebrew
        run: |
          echo "$SHA256  ide-design-$VERSION.tgz" | shasum -a 256 -c
          brew tap-new --no-git ided-release/verify
          node packaging/homebrew/formula.mjs --version "$VERSION" \
            --url "file://$PWD/ide-design-$VERSION.tgz" --sha256 "$SHA256" \
            --homepage "https://github.com/${{ github.repository }}" \
            > "$(brew --repository)/Library/Taps/ided-release/homebrew-verify/Formula/ide-design.rb"
          brew install --build-from-source ided-release/verify/ide-design
          brew test ided-release/verify/ide-design
          brew audit --strict ided-release/verify/ide-design

      - name: Render the published formula
        if: env.PUBLISH == 'true'
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/ide-design-$VERSION.tgz"
          curl -fsSL "$url" -o published.tgz
          echo "$SHA256  published.tgz" | shasum -a 256 -c
          node packaging/homebrew/formula.mjs --version "$VERSION" --url "$url" --sha256 "$SHA256" \
            --homepage "https://github.com/${{ github.repository }}" > ide-design.rb
          cat ide-design.rb

      - name: Push the formula to ${{ github.repository_owner }}/homebrew-tap
        if: env.PUBLISH == 'true' && env.TAP_DEPLOY_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          install -m 700 -d ~/.ssh
          # Pin GitHub's host keys from its API (over HTTPS) instead of trusting on first use.
          # Authenticated: the anonymous API limit is shared by every job on the runner's address.
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Could not read GitHub's SSH host keys"; exit 1; }
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone "git@github.com:${{ github.repository_owner }}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp ide-design.rb tap/Formula/ide-design.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The formula was called "ided" until 0.3. Record the rename so `brew upgrade` moves
          # existing installs over, and drop the old file.
          if [ -f Formula/ided.rb ]; then git rm -q Formula/ided.rb; fi
          node -e '
            const fs = require("fs");
            const f = "formula_renames.json";
            const renames = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : {};
            renames.ided = "ide-design";
            fs.writeFileSync(f, JSON.stringify(renames, null, 2) + "\n");
          '
          git add Formula/ide-design.rb formula_renames.json
          git commit -m "ide-design $VERSION"
          git push origin HEAD
          rm -f ~/.ssh/tap_key

      - name: Tap key missing
        if: env.PUBLISH == 'true' && env.TAP_DEPLOY_KEY == ''
        run: echo "::warning::TAP_DEPLOY_KEY is not set; the formula was verified but not published."
