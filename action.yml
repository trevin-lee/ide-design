name: ide-design brand kit
description: Check an ided workspace and export its brand kit (logos in every colorway, tokens as CSS/Tailwind/JSON).
branding:
  icon: package
  color: orange

inputs:
  working-directory:
    description: Repository path that contains ided.json.
    default: "."
  out:
    description: Output directory for the kit.
    default: out
  check:
    description: Run `ided check` first and fail on errors.
    default: "true"
  version:
    description: ided version to run, e.g. 0.3.1, or "latest".
    default: latest

outputs:
  kit:
    description: Path to the exported brand kit folder.
    value: ${{ steps.export.outputs.kit }}
  zip:
    description: Path to the zipped brand kit.
    value: ${{ steps.export.outputs.zip }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install ided
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ "$VERSION" = "latest" ]; then
          url="https://github.com/trevin-lee/ide-design/releases/latest/download/ide-design.tgz"
        else
          url="https://github.com/trevin-lee/ide-design/releases/download/v${VERSION}/ide-design-${VERSION}.tgz"
          # Releases before 0.3.0 were named ided-<version>.tgz.
          case "$VERSION" in 0.1.*|0.2.*) url="https://github.com/trevin-lee/ide-design/releases/download/v${VERSION}/ided-${VERSION}.tgz" ;; esac
        fi
        npm install -g "$url"

    - name: Check
      if: ${{ inputs.check == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # The brand kit needs no layout measurement (and so no browser download). Versions
      # before 0.4 have no layout check and no --no-layout flag.
      run: |
        if ided check --help | grep -q -- "--no-layout"; then ided check --no-layout; else ided check; fi

    - name: Export
      id: export
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ided export brand --out "${{ inputs.out }}" --zip
        KIT=$(ls -d "${{ inputs.out }}"/*-brand-kit)
        echo "kit=${{ inputs.working-directory }}/$KIT" >> "$GITHUB_OUTPUT"
        echo "zip=${{ inputs.working-directory }}/$KIT.zip" >> "$GITHUB_OUTPUT"
